StylesPath = .vale/styles

MinAlertLevel = suggestion

Packages = write-good, proselint

[*.md]
BasedOnStyles = write-good, proselint

; E-Prime flags every form of "to be" — unusable for blog prose.
write-good.E-Prime = NO

; Flags ordinary programming vocabulary ("implement", "modify", "however") —
; noise for a software blog.
write-good.TooWordy = NO
